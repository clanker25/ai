packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
  - 'examples/*'
  - 'packages/rsc/tests/e2e/next-server'

overrides:
  shell-quote: 1.11.0
  'piscina@4': 4.9.4
  'piscina@5': 5.3.2
  '@simple-git/argv-parser': 3.0.1
  tinyexec: 1.0.2
  oxlint: 1.56.0
  tar: 7.5.19
  '@workflow/world-local@4>undici': 8.29.0
  '@workflow/world-vercel@4>undici': 8.29.0

minimumReleaseAge: 4320 # 3 days

minimumReleaseAgeExclude:
  # First-party packages may be consumed immediately as part of their release flow.
  - 'ai'
  - '@ai-sdk/*'
  - '@vercel/*'
  - '@workflow/*'
  - 'workflow'
  - 'guarded-fetch'

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@nestjs/core': true
  '@parcel/watcher': false
  '@sentry/cli': false
  '@swc/core': false
  '@xai-official/grok': true
  cbor-extract: false
  esbuild: false
  lmdb: true
  msgpackr-extract: true
  msw: false
  node-liblzma: true
  protobufjs: true
  sharp: false
